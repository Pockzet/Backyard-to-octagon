};
const OPP=[
 ['Rusty Cole','Boxing','Regional Qualifier'],['Tank Moreno','Wrestling','Prelims'],['Min-jun Park','Taekwondo','Prelims'],
 ['Dmitri Volkov','BJJ','Rank #15'],['Bruno "Hammer" Silva','Boxing','Rank #12'],['Somchai Petch','Muay Thai','Rank #10'],
 ['Elias Grant','Wrestling','Rank #8'],['Ryu Tanaka','Karate','Rank #6'],['Mateo Rivas','BJJ','Rank #4'],
 ['Cormac "The Wall" Doyle','Boxing','Rank #2'],['Anton Petrov','Muay Thai','#1 Contender'],['Viktor "Iron Tsar" Kozlov','Wrestling','CHAMPION']];

try{const s=localStorage.getItem('byo2');if(s)G=JSON.parse(s);const m=localStorage.getItem('byo2m');if(m!==null)mobile=m==='1'}catch(e){}
const save=()=>{try{localStorage.setItem('byo2',JSON.stringify(G));localStorage.setItem('byo2m',mobile?'1':'0')}catch(e){}};

/* ---------- 3D scene ---------- */
const cv=$('#c'),R=new THREE.WebGLRenderer({canvas:cv,antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
R.shadowMap.enabled=true;R.shadowMap.type=THREE.PCFSoftShadowMap;R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.25;

const sp=new THREE.SpotLight(0xfff2dd,1.9,40,.8,.5);sp.position.set(0,12,3);sp.castShadow=true;sp.shadow.mapSize.set(1024,1024);scene.add(sp);
const sp2=new THREE.PointLight(0xd62828,.6,25);sp2.position.set(-7,5,-4);scene.add(sp2);
const fl=new THREE.Mesh(new THREE.CylinderGeometry(6.6,6.6,.3,8),M(0x2a2d3a));fl.position.y=-.15;fl.rotation.y=Math.PI/8;scene.add(fl);
const ring=new THREE.Mesh(new THREE.CylinderGeometry(3.4,3.4,.02,40),M(0xb01e1e));ring.position.y=.01;ring.receiveShadow=fl.receiveShadow=true;scene.add(ring);
const rr=new THREE.Mesh(new THREE.RingGeometry(3.3,3.4,40),new THREE.MeshBasicMaterial({color:0xf4efe6}));rr.rotation.x=-Math.PI/2;rr.position.y=.022;scene.add(rr);
const bse=new THREE.Mesh(new THREE.CylinderGeometry(7.4,7.4,.5,8),M(0x14151b));bse.position.y=-.4;bse.rotation.y=Math.PI/8;scene.add(bse);
for(let i=0;i<8;i++){const a=i/8*Math.PI*2,r=6.2;
 const p=new THREE.Mesh(new THREE.BoxGeometry(.2,2,.2),M(0x777777));p.position.set(Math.cos(a)*r,1,Math.sin(a)*r);scene.add(p);
 const a2=a+Math.PI/8,w=new THREE.Mesh(new THREE.BoxGeometry(.04,1.7,4.7),new THREE.MeshLambertMaterial({color:0x444a5a,transparent:true,opacity:.35}));
 w.position.set(Math.cos(a2)*6.05,1,Math.sin(a2)*6.05);w.rotation.y=-a2;scene.add(w)}
const cr=new THREE.InstancedMesh(new THREE.BoxGeometry(.5,.8,.4),new THREE.MeshLambertMaterial({color:0xffffff}),420),dm=new THREE.Object3D(),cc=new THREE.Color();
for(let i=0;i<420;i++){const row=i%6,a=Math.random()*6.28,r=9+row*1.4;dm.position.set(Math.cos(a)*r,.6+row*.7,Math.sin(a)*r);dm.updateMatrix();cr.setMatrixAt(i,dm.matrix);cr.setColorAt(i,cc.setHSL(Math.random(),.3,.12+Math.random()*.15))}
scene.add(cr);
/* ---------- gore system ---------- */
const NP=160,pg=new THREE.BufferGeometry(),pp=new Float32Array(NP*3),pv=[],pl=new Float32Array(NP),BR=new THREE.Color(0x5a2a3a),LN={aL:'LEFT ARM',aR:'RIGHT ARM',lL:'LEFT LEG',lR:'RIGHT LEG'};
for(let i=0;i<NP;i++){pp[i*3+1]=-50;pv.push([0,0,0])}
pg.setAttribute('position',new THREE.BufferAttribute(pp,3));
const pts=new THREE.Points(pg,new THREE.PointsMaterial({color:0x9b0a0a,size:.09}));pts.frustumCulled=false;scene.add(pts);
let pi=0;
function blood(p,vx,vy,vz){const i=pi++%NP;pp[i*3]=p.x;pp[i*3+1]=p.y;pp[i*3+2]=p.z;pv[i]=[vx,vy,vz];pl[i]=1}
function pup(dt){for(let i=0;i<NP;i++){if(!pl[i])continue;const v=pv[i];v[1]-=9*dt;pp[i*3]+=v[0]*dt;pp[i*3+1]+=v[1]*dt;pp[i*3+2]+=v[2]*dt;if(pp[i*3+1]<=.03){pl[i]=0;pp[i*3+1]=-50;splat(pp[i*3],pp[i*3+2])}}pg.attributes.position.needsUpdate=true}
const sg=new THREE.CircleGeometry(1,10),sm=new THREE.MeshBasicMaterial({color:0x6e0505,transparent:true,opacity:.85,depthWrite:false}),splats=[];
function splat(x,z,big){if(splats.length>150)scene.remove(splats.shift());const s=new THREE.Mesh(sg,sm),r=(.04+Math.random()*.12)*(big||1);s.rotation.x=-Math.PI/2;s.position.set(x,.03,z);s.scale.set(r,r,r);scene.add(s);splats.push(s)}
function cut(o){o.cuts++;const c=new THREE.Mesh(new THREE.BoxGeometry(.08,.2,.12),new THREE.MeshBasicMaterial({color:0x7a0000}));c.position.set(.48,-.3+Math.random()*.55,(Math.random()-.5)*.7);c.rotation.x=Math.random();o.m.head.add(c)}
function dislocate(o){const ks=['aL','aR','lL','lR'].filter(k=>!o.dis[k]);if(!ks.length)return;const k=ks[Math.random()*ks.length|0];o.dis[k]=1;
 const p=new THREE.Vector3(o.x,k[0]==='a'?1.5:.8,0);for(let i=0;i<14;i++)blood(p,(Math.random()-.5)*3,1+Math.random()*2,(Math.random()-.5)*3);
 beep(70,.15,'square',.15);setTimeout(()=>beep(50,.25,'square',.12),90);
 say((o===FT.P?'YOUR ':'THEIR ')+LN[k]+' POPPED OUT!',1500);if(o!==FT.P)FT.disC=(FT.disC||0)+1;else FT.disP=(FT.disP||0)+1;cmt(rnd(CL.dis),1);cheer(1);FT.slow=Math.max(FT.slow||0,.6);
 cv.style.filter='invert(1) hue-rotate(180deg) contrast(1.3)';setTimeout(()=>cv.style.filter='',150)}

 const n=Math.min(40,6+(d*2.5|0)),p=new THREE.Vector3(o.x,k==='kick'?1.6:1.9-Math.random()*.7,0);

 return{o,b,up,head,skin,col,aR:arm(.33),aL:arm(-.33),lR:leg(.14),lL:leg(-.14)}

function mkF(st,sty,col,skin,x,dir){const m=body(col,skin);scene.add(m.o);const S=STY[sty];
 const f={m,x,dir,sty:S,gr:(st.pow+st.def+st.sta)/3*(GM[sty]||1),hpM:160+st.chin*16,stM:50+st.sta*8,dmgM:1+st.pow*.07,spd:(2.6+st.spd*.18)*S.sp,def:1/(1+st.def*.06),score:0};

/* ---------- combat ---------- */
function say(t,ms){const m=$('#msg');m.textContent=t;m.style.opacity=1;clearTimeout(say.h);say.h=setTimeout(()=>m.style.opacity=0,ms||1200)}
function step(f,o,dt,i){
 f.dir=Math.sign(o.x-f.x)||f.dir;{const dx=o.x-f.x,dz=o.z-f.z,dd=Math.hypot(dx,dz)||1;f.ux=dx/dd;f.uz=dz/dd}f.dg-=dt;f.dcd-=dt;f.flash-=dt;f.vuln-=dt;f.flcd-=dt;if((f.ct-=dt)<=0){f.cb=0;f.sq=[]}
 if(f.vx||f.vz){f.x+=f.vx*dt;f.z+=f.vz*dt;const dm=Math.pow(.003,dt);f.vx*=dm;f.vz*=dm;if(Math.abs(f.vx)+Math.abs(f.vz)<.05)f.vx=f.vz=0;const r=Math.hypot(f.x,f.z);if(r>5.3){f.x*=5.3/r;f.z*=5.3/r}}
 if(f.ko)return;
 if(f.fl>0){f.fl-=dt;f.mv=0;f.blk=0;f.atk=null;f.rel=null;if(f.fl<=0)getUp(f);return}
